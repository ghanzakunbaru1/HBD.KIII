<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ucapan Ulang Tahun</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', Arial, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff7eb3, #8e44ad);
      overflow: hidden;
    }/* Background animation */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.25), transparent 40%),
              radial-gradient(circle at 80% 80%, rgba(255,255,255,0.2), transparent 40%);
  animation: floatBg 12s ease-in-out infinite alternate;
  z-index: -1;
}

@keyframes floatBg {
  from { transform: translateY(0); }
  to { transform: translateY(-20px); }
}

.card {
  background: rgba(255,255,255,0.95);
  padding: 32px 26px;
  border-radius: 18px;
  width: 90%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  animation: cardIn 0.8s ease;
}

@keyframes cardIn {
  from { transform: scale(0.85) translateY(20px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

h1 {
  font-size: 1.6rem;
  margin-bottom: 16px;
  animation: fadeSlide 0.8s ease;
}

p {
  font-size: 1rem;
  margin-bottom: 20px;
  animation: fadeSlide 0.9s ease;
}

@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

button {
  padding: 12px 20px;
  font-size: 1rem;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: linear-gradient(135deg, #ff5fa2, #a855f7);
  color: #fff;
  margin: 8px 0;
  width: 100%;
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(0,0,0,0.2);
}

button:disabled {
  opacity: 0.6;
  cursor: default;
  box-shadow: none;
}

.hidden {
  display: none;
}

.kode {
  font-weight: 600;
  letter-spacing: 1px;
  background: linear-gradient(135deg, #ffe4f1, #f3e8ff);
  padding: 12px;
  border-radius: 10px;
  margin: 14px 0;
  animation: pulse 1.8s ease-in-out infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

  </style>
</head>
<body>
  <div class="card">
    <h1 id="judul">SELAMAT ULANG TAHUN YANG KE 15 YA KIIII🥳🎉</h1>
    <p id="deskripsi">Semoga selalu sehat, bahagia, dan semua hal baik datang ke kamu🤍</p><button id="btnGanti">Lanjut</button>
<button id="btnHadiah" class="hidden">Klaim Hadiah</button>

<div id="hadiah" class="hidden">
  <p>hadiah kamu:</p>
  <div class="kode">kuota gatau berapa gb</div>
  <p>Klaim ke nomor berikut:</p>
  <a href="https://wa.me/6283197769004" target="_blank" style="text-decoration:none;"><button id="btnWa">6283197769004</button></a>
 
</div>

  </div><audio id="bgm" src="https://files.catbox.moe/508lmz.m4a" preload="auto"></audio>

  <script>
    const judul = document.getElementById('judul');
    const deskripsi = document.getElementById('deskripsi');
    const btnGanti = document.getElementById('btnGanti');
    const btnHadiah = document.getElementById('btnHadiah');
    const hadiah = document.getElementById('hadiah');
    const bgm = document.getElementById('bgm');

    let musicStarted = false;

    btnGanti.addEventListener('click', () => {
      if (!musicStarted) {
        bgm.play().catch(() => {});
        musicStarted = true;
      }

      judul.textContent = 'YAHAHAH NAMBAH TUA KAU';
      deskripsi.textContent = 'AWOKAWOK.';
      btnGanti.disabled = true;

      setTimeout(() => {
        judul.textContent = 'SEDIKIT UCAPAN';
        deskripsi.textContent = 'Semoga selalu diberi kesehatan, kelancaran dalam segala urusan, serta kesuksesan di masa depan Amin. nih ada hadiah';
        btnHadiah.classList.remove('hidden');
      }, 2000);
    });

    btnHadiah.addEventListener('click', () => {
      hadiah.classList.remove('hidden');
      btnHadiah.disabled = true;
    });
  </script></body>
</html>
